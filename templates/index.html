<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-primary mb-4">HỆ THỐNG QUẢN LÝ SINH VIÊN</h2>

    <!-- Form Thêm Sinh Viên -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">Thêm Sinh Viên Mới</div>
        <div class="card-body">
            <form action="/add" method="POST" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="student_id" class="form-control" placeholder="Mã SV" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="name" class="form-control" placeholder="Họ và Tên" required>
                </div>
                <div class="col-md-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="major" class="form-control" placeholder="Ngành Học" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success">Thêm Sinh Viên</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thanh Tìm Kiếm -->
    <form action="/" method="GET" class="mb-3 d-flex">
        <input type="text" name="search" class="form-control me-2" placeholder="Tìm theo tên hoặc mã SV..." value="{{ search_query }}">
        <button type="submit" class="btn btn-secondary">Tìm</button>
    </form>

    <!-- Bảng Danh Sách Sinh Viên -->
    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Mã SV</th>
                <th>Họ Tên</th>
                <th>Email</th>
                <th>Ngành Học</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student['student_id'] }}</td>
                <td>{{ student['name'] }}</td>
                <td>{{ student['email'] }}</td>
                <td>{{ student['major'] }}</td>
                <td>
                    <a href="/delete/{{ student['id'] }}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center text-muted">Chưa có dữ liệu sinh viên.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
