{% extends 'base.html' %}

{% block content %}
<style>
    /* Gradient xanh dương cho tiêu đề bảng */
    .profile-header {
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        color: white;
    }
    /* Chỉnh màu và kích thước cho các icon */
    .icon-blue {
        color: #0d6efd;
        font-size: 1.2rem;
        margin-right: 12px;
    }
</style>

<div class="container mt-5 mb-5">
    <div class="row">

        <!-- CỘT TRÁI: Avatar và các nút thao tác -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <!-- Đổi màu nền avatar thành xanh dương (background=0d6efd) -->
                    <img src="https://ui-avatars.com/api/?name={{name}}&background=0d6efd&color=fff&size=150" alt="Avatar" class="rounded-circle img-fluid mb-3 shadow-sm border border-3 border-primary">

                    <h4 class="fw-bold text-primary">{{name}}</h4>
                    <p class="text-secondary mb-1">Mã sinh viên: <strong class="text-dark">{{student_id}}</strong></p>
                    <p class="text-secondary mb-4">Ngành: <span class="badge bg-info text-dark">{{major}}</span></p>

                    <!-- Nút chức năng xếp dọc gọn gàng -->
                    <button class="btn btn-outline-primary w-100 mb-2 fw-bold">
                        <i class="bi bi-camera me-2"></i>Chỉnh sửa ảnh
                    </button>
                    <a href="/logout" class="btn btn-danger w-100 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                    </a>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: Khối thông tin chi tiết -->
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header profile-header fw-bold p-3 border-0">
                    <i class="bi bi-person-vcard me-2"></i>Thông tin cá nhân
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush rounded-bottom">

                        <li class="list-group-item d-flex justify-content-between align-items-center p-4">
                            <div>
                                <i class="bi bi-person-fill icon-blue"></i>
                                <span class="text-muted fw-bold">Họ và tên</span>
                            </div>
                            <strong class="text-dark">{{name}}</strong>
                        </li>

                        <li class="list-group-item d-flex justify-content-between align-items-center p-4">
                            <div>
                                <i class="bi bi-envelope-fill icon-blue"></i>
                                <span class="text-muted fw-bold">Email liên hệ</span>
                            </div>
                            <strong class="text-primary">{{email}}</strong>
                        </li>

                        <li class="list-group-item d-flex justify-content-between align-items-center p-4">
                            <div>
                                <i class="bi bi-shield-lock-fill icon-blue"></i>
                                <span class="text-muted fw-bold">Vai trò hệ thống</span>
                            </div>
                            <span class="badge bg-primary rounded-pill px-3 py-2">{{role}}</span>
                        </li>

                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
