{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img src="https://ui-avatars.com/api/?name={{name}}&background=random&size=150" alt="Avatar" class="rounded-circle img-fluid mb-3">

                    <h4>{{name}}</h4>
                    <p class="text-secondary">Mã sinh viên: {{student_id}} </p>
                    <p class="text-secondary">Ngành: {{major}} </p>

                    <button class="btn btn-primary btn-sm">Chinh sua anh</button>
                </div>
            </div>

        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">
                    Thông tin cá nhân
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between"><strong>Họ và tên: </strong>{{name}}</li>

                        <li class="list-group-item d-flex justify-content-between">
                            <strong>Email: </strong>{{email}}
                        </li>

                        <li class="list-group-item d-flex justify-content-between">
                            <strong>Vai trò:</strong>{{role}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-8">

        </div>
    </div>
</div>


<a href="/logout" class="btn btn-danger fw-bold">Đăng xuất</a>
{% endblock %}
