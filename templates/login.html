{% extends 'base.html' %}

{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .glass-login {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        width: 100%;
        max-width: 420px;
        padding: 3rem 2.5rem;
    }

    .glass-input {
        background: rgba(255, 255, 255, 0.9) !important;
        border: 1px solid rgba(15, 118, 110, 0.2) !important;
        border-radius: 12px;
        padding: 0.75rem 1rem;
    }

    .glass-input:focus {
        border-color: #0f766e !important;
        box-shadow: 0 0 0 0.25rem rgba(15, 118, 110, 0.2) !important;
    }
</style>

<div class="login-wrapper">
    <div class="glass-login text-center">
        <h2 class="serif-text fw-bold mb-2" style="color: #0f766e;">PTIT Portal</h2>
        <p class="text-muted mb-4">Hệ thống Quản lý Đào tạo</p>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-muted fw-medium small mb-1">Mã Sinh Viên / Tài khoản</label>
                <input type="text" name="username" class="form-control glass-input" required autocomplete="off">
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-muted fw-medium small mb-1">Mật khẩu</label>
                <input type="password" name="password" class="form-control glass-input" required>
            </div>

            <button type="submit" class="btn w-100 rounded-pill text-white fw-bold shadow-sm" style="background-color: #0f766e; padding: 12px;">
                Đăng Nhập
            </button>
        </form>
    </div>
</div>
{% endblock %}
